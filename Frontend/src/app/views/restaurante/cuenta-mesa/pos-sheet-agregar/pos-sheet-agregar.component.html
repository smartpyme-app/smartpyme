<div class="modal fade" [class.show]="visible" [class.d-block]="visible" tabindex="-1" *ngIf="visible && producto"
  (click)="onCancelar()" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content shadow">
      <div class="modal-header">
        <h5 class="modal-title">{{ producto?.nombre }}</h5>
        <button type="button" class="btn-close" (click)="onCancelar()" [disabled]="enviando" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-3">{{ producto?.precio | currency }}</p>

        <label class="form-label">Cantidad</label>
        <div class="pos-sheet-cantidad mb-3">
          <button type="button" class="btn btn-outline-secondary" (click)="decrementar()" [disabled]="enviando" title="Restar">
            <i class="fa fa-minus"></i>
          </button>
          <input type="number" class="form-control text-center" min="0.01" step="0.01" [(ngModel)]="cantidad" (blur)="onCantidadBlur()" [disabled]="enviando">
          <button type="button" class="btn btn-outline-secondary" (click)="incrementar()" [disabled]="enviando" title="Sumar">
            <i class="fa fa-plus"></i>
          </button>
        </div>

        <label class="form-label">Nota (opcional)</label>
        <textarea class="form-control" rows="2" maxlength="255" [(ngModel)]="notas" placeholder="Ej: sin cebolla" [disabled]="enviando"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancelar()" [disabled]="enviando">Cancelar</button>
        <button type="button" class="btn btn-primary" [disabled]="cantidad < 0.01 || enviando" (click)="onConfirmar()">
          <span *ngIf="!enviando"><i class="fa fa-check me-1"></i>Agregar</span>
          <span *ngIf="enviando">Agregando...</span>
        </button>
      </div>
    </div>
  </div>
</div>
