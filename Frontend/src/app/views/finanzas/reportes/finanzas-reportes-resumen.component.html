@if (enLibrosFiscales) {
  <section class="bg-white p-4 rounded mb-3">
    <h2 class="mb-0">{{ 'country.tax.libroIva.pageTitle' | translate }}</h2>
  </section>
} @else {
  <section class="d-flex justify-content-between bg-white p-4 rounded mb-3">
    <h2 class="page-heading mb-0">Reportes</h2>
  </section>
}

<div class="bg-white p-4 rounded mb-3">
  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center" [class.justify-content-end]="!enLibrosFiscales">
    @if (enLibrosFiscales) {
      @switch (tipoLibro) {
        @case ('sv') { <app-libro-iva-sv-nav /> }
        @case ('cr') { <app-libro-iva-cr-nav /> }
        @case ('hd') { <app-libro-iva-hd-nav /> }
        @default { <app-libro-iva-general-nav /> }
      }
    }
    <div class="d-flex gap-2 flex-wrap align-items-center" [class.ms-auto]="enLibrosFiscales">
      <app-libro-iva-periodo-filtros
        [filtros]="filtros"
        [years]="years"
        [sucursales]="sucursales"
        (periodoChange)="loadData()"
      />
      <app-libro-iva-resumen-descargas [filtros]="filtros" />
    </div>
  </div>

  @if (!enLibrosFiscales) {
    <div class="d-flex mb-3">
      <app-finanzas-reportes-nav />
    </div>
  }

  <app-libro-iva-resumen-panel [fiscalResumen]="fiscalResumen" [loading]="loading" />
</div>
