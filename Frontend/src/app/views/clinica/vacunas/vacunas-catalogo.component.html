<section class="d-flex justify-content-between bg-white p-4 rounded mb-3">
    <h2 class="page-heading mb-0">Catálogo de vacunas</h2>
    <button type="button" class="btn btn-default" [routerLink]="['/clinica/pacientes']">Pacientes</button>
</section>

<section class="bg-white p-4 rounded mb-3">
    <h6 class="mb-3">Nuevo ítem</h6>
    <div class="row">
        <div class="form-group col-md-4">
            <input class="form-control" placeholder="Nombre" [(ngModel)]="nuevo.nombre" name="nombre">
        </div>
        <div class="form-group col-md-2">
            <select class="form-control" [(ngModel)]="nuevo.tipo" name="tipo">
                <option value="vacuna">Vacuna</option>
                <option value="preventivo">Preventivo</option>
            </select>
        </div>
        <div class="form-group col-md-2">
            <select class="form-control" [(ngModel)]="nuevo.tipo_paciente" name="tipo_paciente">
                <option value="">Todos</option>
                <option value="HUMANO">Humano</option>
                <option value="ANIMAL">Animal</option>
            </select>
        </div>
        <div class="form-group col-md-2">
            <input type="number" class="form-control" placeholder="Intervalo días" [(ngModel)]="nuevo.intervalo_dias" name="intervalo_dias">
        </div>
        <div class="form-group col-md-2">
            <button type="button" class="btn btn-primary w-100" [disabled]="guardando" (click)="crear()">Agregar</button>
        </div>
    </div>
</section>

<section class="bg-white p-4 rounded mb-3">
    @if (cargando) {
        <span class="badge bg-primary">Cargando...</span>
    }
    @if (!cargando) {
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Nombre</th><th>Tipo</th><th>Paciente</th><th>Intervalo</th><th>Activo</th></tr></thead>
                <tbody>
                    @for (item of items; track item.id) {
                        <tr>
                            <td>{{ item.nombre }}</td>
                            <td>{{ item.tipo }}</td>
                            <td>{{ item.tipo_paciente || 'Todos' }}</td>
                            <td>{{ item.intervalo_dias || '—' }}</td>
                            <td>{{ item.activo ? 'Sí' : 'No' }}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    }
</section>
