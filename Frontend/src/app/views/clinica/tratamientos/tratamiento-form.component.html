<section class="d-flex justify-content-between bg-white p-4 rounded mb-3">
    <h2 class="page-heading mb-0">{{ esEdicion ? 'Editar tratamiento' : 'Nuevo plan de tratamiento' }}</h2>
    <button type="button" class="btn btn-default" [routerLink]="['/clinica/pacientes', idPaciente, 'expediente']">Regresar</button>
</section>

@if (cargando) {
    <section class="bg-white p-4 rounded"><span class="badge bg-primary">Cargando...</span></section>
}

@if (!cargando) {
    <section class="bg-white p-4 rounded mb-3">
        <div class="row">
            <div class="form-group col-md-6">
                <label>Nombre corto (opcional)</label>
                <input class="form-control" [(ngModel)]="plan.nombre" name="nombre">
            </div>
            <div class="form-group col-md-3">
                <label>Inicio</label>
                <input type="date" class="form-control" [(ngModel)]="plan.fecha_inicio" name="fecha_inicio">
            </div>
            <div class="form-group col-md-3">
                <label>Fin (opcional)</label>
                <input type="date" class="form-control" [(ngModel)]="plan.fecha_fin" name="fecha_fin">
            </div>
            <div class="form-group col-12">
                <label>Descripción del plan</label>
                <textarea class="form-control" rows="2" [(ngModel)]="plan.descripcion" name="descripcion"></textarea>
            </div>
            <div class="form-group col-md-3">
                <label>Sucursal</label>
                <select class="form-select" [(ngModel)]="plan.id_sucursal" name="id_sucursal">
                    <option value="">Seleccione</option>
                    @for (s of sucursales; track s.id) {
                        <option [ngValue]="s.id">{{ s.nombre }}</option>
                    }
                </select>
            </div>
            <div class="form-group col-md-3">
                <label>Profesional</label>
                <select class="form-select" [(ngModel)]="plan.id_usuario_profesional" name="id_usuario_profesional">
                    <option value="">Seleccione</option>
                    @for (p of profesionales; track p.id) {
                        <option [ngValue]="p.id_usuario">{{ p.nombre }}</option>
                    }
                </select>
            </div>
            <div class="form-group col-md-3">
                <label>Frecuencia</label>
                <input class="form-control" [(ngModel)]="plan.frecuencia" name="frecuencia" placeholder="Ej. 2 veces por semana">
            </div>
            <div class="form-group col-md-3">
                <label>Duración</label>
                <input class="form-control" [(ngModel)]="plan.duracion" name="duracion" placeholder="Ej. 4 semanas">
            </div>
            <div class="form-group col-12">
                <label>Indicaciones</label>
                <textarea class="form-control" rows="3" [(ngModel)]="plan.indicaciones" name="indicaciones"></textarea>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-primary" [disabled]="guardando" (click)="guardar()">Guardar plan</button>
        </div>
    </section>
}
