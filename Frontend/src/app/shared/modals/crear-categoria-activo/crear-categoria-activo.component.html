<button type="button" class="btn btn-default" (click)="openModal(mCategoria)" tooltip="Crear categoría">
    <i class="fa fa-plus"></i>
</button>

<ng-template #mCategoria>
    <div class="modal-header">
        <h5 class="modal-title">Nueva categoría</h5>
        <button type="button" class="btn-close" (click)="modalRef.hide()"></button>
    </div>
    <div class="modal-body">
        <form name="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" [(ngModel)]="categoria.nombre" name="nombre" required>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">% anual</label>
                    <input type="number" class="form-control" [(ngModel)]="categoria.porcentaje_anual" name="porcentaje_anual" min="0" max="100" step="0.01" (change)="sincronizarDesdePorcentaje()">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vida útil (años)</label>
                    <input type="number" class="form-control" [(ngModel)]="categoria.vida_util_anios" name="vida_util_anios" min="0" step="0.01" (change)="sincronizarDesdeVidaUtil()">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loading">
                @if (loading) { Guardando... } @else { Guardar }
            </button>
        </form>
    </div>
</ng-template>
