; Pool equivalente al de producción (ondemand, 80 hijos, 1000 peticiones por hijo).
[www]
user = smartpyme
group = smartpyme
listen = 9000
pm = ondemand
pm.max_children = 80
pm.max_requests = 1000
pm.process_idle_timeout = 10s
ping.path = /ping
pm.status_path = /status
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
