; Valores tomados del servidor de producción (pool apiunificado, PHP 8.4).
; Si se cambian aquí, cambiarlos también en el servidor para no tener diferencias.
date.timezone = UTC
memory_limit = 128M
max_execution_time = 30
max_input_vars = 1000
post_max_size = 8M
upload_max_filesize = 2M
short_open_tag = On
allow_url_fopen = On
disable_functions = passthru,system
error_reporting = E_ALL & ~E_NOTICE
log_errors = On
display_errors = Off
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.max_accelerated_files = 60000
opcache.interned_strings_buffer = 32
opcache.jit = disable
