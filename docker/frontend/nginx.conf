# Equivale al .htaccess de app.smartpyme.site:
#  - archivo o carpeta existente -> se sirve tal cual
#  - cualquier otra ruta -> index.html (rutas de Angular)
#  - archivos con hash -> caché de 1 año; index.html y service worker -> no-cache
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* "\.[0-9a-f]{16,}\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.map$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
