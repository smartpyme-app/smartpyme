# API Laravel. En producción delante hay nginx + Apache de cPanel; aquí basta nginx + PHP-FPM.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;   # igual a post_max_size del servidor
    charset utf-8;

    # DNS de Docker: si el contenedor app se recrea, nginx encuentra la nueva IP
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ~ /\.(?!well-known) { deny all; }
}
