# SmartPyme en Docker — réplica local del servidor de producción.
#
#   cp Backend/.env.docker.example Backend/.env.docker   (y completar claves de prueba)
#   docker compose up -d --build
#
#   API (Laravel)    http://localhost:8080
#   App (Angular)    http://localhost:8081   (compilado, --profile fe-build, ~8 GB)
#   App en vivo      http://localhost:4200   (docker compose --profile dev-fe up -d)
#   MariaDB          localhost:3307
#   Redis            localhost:6380
#
# Ver docker/README.md para el detalle.

name: smartpyme

x-backend: &backend
  build:
    context: ./Backend
    dockerfile: ../docker/php/Dockerfile
    target: ${BACKEND_TARGET:-dev}
    additional_contexts:
      docker: ./docker
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: smartpyme/backend:${BACKEND_TARGET:-dev}
  env_file: ./Backend/.env.docker
  volumes:
    - ./Backend:/var/www/html
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *backend

  web:
    image: nginx:1.28.0-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/public:/var/www/html/public:ro
    depends_on: [app]
    restart: unless-stopped

  # Igual que supervisor en el servidor: 3 procesos con los mismos parámetros
  worker:
    <<: *backend
    command: >
      php artisan queue:work redis --queue=default --sleep=3 --tries=3
      --timeout=3600 --max-jobs=1000 --max-time=3600 --memory=512
    deploy:
      replicas: 3
    stop_grace_period: 60s

  # Equivale al cron "* * * * * php artisan schedule:run".
  # APAGADO por defecto: con una copia de datos reales enviaría reportes, correos y DTE.
  # Encender solo con datos de prueba:  docker compose --profile scheduler up -d
  scheduler:
    <<: *backend
    profiles: ["scheduler"]
    command: php artisan schedule:work

  mariadb:
    image: mariadb:10.11.14
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-smartpyme_prod}
      MARIADB_USER: ${DB_USERNAME:-smartpyme}
      MARIADB_PASSWORD: ${DB_PASSWORD:-smartpyme}
      TZ: UTC
    ports: ["3307:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mariadb/dumps:/dumps:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:6.2.20-alpine
    ports: ["6380:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Frontend compilado y servido como en producción. Opcional: necesita ~8 GB para compilar
  # (en el día a día usar frontend-dev o "npm start" fuera de Docker).
  #   docker compose --profile fe-build up -d --build frontend
  frontend:
    profiles: ["fe-build"]
    build:
      context: ./Frontend
      dockerfile: ../docker/frontend/Dockerfile
      additional_contexts:
        docker: ./docker
      args:
        NG_CONFIGURATION: ${NG_CONFIGURATION:-production,docker}
    image: smartpyme/frontend:${FRONTEND_TAG:-local}
    ports: ["8081:80"]
    restart: unless-stopped

  # Frontend con recarga en vivo, para desarrollar (opcional)
  frontend-dev:
    profiles: ["dev-fe"]
    image: node:22.21.1-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && node --max-old-space-size=4096 ./node_modules/@angular/cli/bin/ng.js serve --configuration docker-dev --host 0.0.0.0 --poll 2000"
    ports: ["4200:4200"]
    volumes:
      - ./Frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mariadb-data:
  redis-data:
  frontend-node-modules:
